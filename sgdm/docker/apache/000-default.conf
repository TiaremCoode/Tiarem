<VirtualHost *:80>
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Las carpetas de la aplicación (app/) nunca deben quedar accesibles
    # directamente por HTTP; solo public/ es el DocumentRoot, así que
    # /app queda fuera del árbol servido por Apache.

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
